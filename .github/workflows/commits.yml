# Pull request rules that need no build:
# - "Commit messages": the title and the subject of every commit use `type: subject` in printable
#   ASCII. The rules are in "Commit Messages" in CONTRIBUTING.md.
# - "Source branch": a pull request into `main` comes from a branch of this repository.
#
# The release is cut from `main` by pushing a tag (see the Release workflow), so merging does not
# need to carry a version.

name: Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    env:
      # In the C locale, [[:graph:]] and [[:print:]] match printable ASCII only.
      LC_ALL: C
      PATTERN: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test): [[:graph:]][[:print:]]*$'
      # Subjects that Git and GitHub write themselves: reverts and autosquash commits.
      EXEMPT: '^(Revert "|fixup! |squash! |amend! )'
      HINT: >-
        Use "type: subject" in printable ASCII, for example "fix: keep the cursor column after
        undo". Types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests into `main` are merged with a merge commit, so their title may also start
      # with "Merge".
      - name: Title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "${TITLE}" =~ ${PATTERN} || "${TITLE}" =~ ${EXEMPT} ]] \
            || [[ "${GITHUB_BASE_REF}" == main && "${TITLE}" == Merge\ * ]]; then
            exit 0
          fi
          echo "::error title=Invalid pull request title::${TITLE}"
          echo "${HINT}"
          exit 1

      # Merge commits are skipped whatever their subject.
      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if [[ ! "${subject}" =~ ${PATTERN} && ! "${subject}" =~ ${EXEMPT} ]]; then
              echo "::error title=Invalid commit subject::${sha:0:12} ${subject}"
              status=1
            fi
          done < <(git log --no-merges --format='%H %s' "${BASE}..${HEAD}")
          if ((status != 0)); then
            echo "${HINT} Reword the commits with \`git rebase -i\`, then force-push."
          fi
          exit "${status}"

  # `main` is the development branch of this repository: only branches of this repository merge
  # into it. The job also runs when a pull request is retargeted, because that raises the
  # `edited` event.
  source:
    name: Source branch
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Only branches of this repository merge into main
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Only branches of ${GITHUB_REPOSITORY} can be merged into main." \
              "Fork the repository and open the pull request from the fork if that is intended."
            exit 1
          fi
