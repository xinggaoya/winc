name: Release Tag

# A release is cut from `main` by pushing a tag: the tag itself starts the Release workflow, which
# builds every platform and publishes the release with the notes taken from the commit log.
#
# This workflow is the manual counterpart: it tags the version in the VERSION file as `v<version>`
# and starts the Release workflow on that tag. Use it when the tag should be created for you; a
# version that is already tagged does nothing, so a failed release can be retried by running the
# Release workflow on the existing tag.
#
# The tag is pushed with GITHUB_TOKEN, and events raised that way do not start
# other workflows, so they are started explicitly via workflow_dispatch (the
# documented exception).

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Pushes are handled one at a time, so a later push sees the tag an earlier one created.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and dispatch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the version tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node release/common/version.mjs)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Start release builds for the tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "refs/tags/$RELEASE_TAG"
